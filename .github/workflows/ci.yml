name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets the e2e job post failure details back onto the pull request, which is
  # readable without downloading job logs or artifacts.
  pull-requests: write

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

  build:
    name: Production build and static server
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs the strict TypeScript gate before bundling.
      - name: Build
        run: npm run build

      - name: Static server integration tests
        run: npm run test:server

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        # Tee the run into the step summary so a failure is readable from the
        # check-run output, not only from the downloadable job log.
        run: |
          set -o pipefail
          npx playwright test --project=desktop --project=mobile \
            --reporter=list 2>&1 | tee playwright-output.txt

      - name: Publish failure details to the job summary
        if: failure()
        run: |
          {
            echo '### Playwright failures'
            echo
            echo '```'
            grep -E '✘|Error|expect|Received|Expected|at /' playwright-output.txt | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Job logs and artifacts live on a separate storage host, so also post the
      # failing assertions as a PR comment where they are easy to reach.
      - name: Comment failure details on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Playwright failure details'
            echo
            echo '```'
            grep -E '✘|Error:|expect\(|Received|Expected|locator' playwright-output.txt | tail -n 80 || true
            echo '```'
          } > /tmp/body.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file /tmp/body.md

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: playwright-output.txt
          if-no-files-found: warn
